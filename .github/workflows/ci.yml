name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:release

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: content-node/go.mod
          cache-dependency-path: content-node/go.sum
      - run: go test ./...
        working-directory: content-node
      - run: go vet ./...
        working-directory: content-node
