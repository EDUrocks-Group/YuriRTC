name: Self-hosted CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Never execute untrusted fork code on the persistent EDUrocks machine.
    # This job has no repository secrets; manifest signing for tests uses a
    # fresh in-memory key pair generated by the test harness.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          # Do not leave the workflow token where checked-out test code can
          # recover it from git configuration.
          persist-credentials: false
      - name: Refuse release credentials in the CI workspace
        shell: bash
        run: |
          if [[ -e .env.release ]]; then
            echo ".env.release must never exist in a self-hosted CI workspace" >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: content-node/go.mod
          cache-dependency-path: content-node/go.sum
      - name: Install JavaScript dependencies without release credentials
        run: >-
          env -u YURIRTC_MANIFEST_SIGNING_PRIVATE_KEY
          -u NPM_LOADER_TOKEN -u NPM_INTEGRITY_TOKEN
          -u NPM_TOKEN -u NODE_AUTH_TOKEN
          NPM_CONFIG_USERCONFIG=/dev/null
          npm ci
      - name: Install cross-browser test engines
        run: >-
          env -u YURIRTC_MANIFEST_SIGNING_PRIVATE_KEY
          -u NPM_LOADER_TOKEN -u NPM_INTEGRITY_TOKEN
          -u NPM_TOKEN -u NODE_AUTH_TOKEN -u NPM_CONFIG_USERCONFIG
          node node_modules/playwright-core/cli.js install --with-deps chromium firefox webkit
      - name: Verify with ephemeral test signing only
        run: >-
          env -u YURIRTC_MANIFEST_SIGNING_PRIVATE_KEY
          -u NPM_LOADER_TOKEN -u NPM_INTEGRITY_TOKEN
          -u NPM_TOKEN -u NODE_AUTH_TOKEN
          NPM_CONFIG_USERCONFIG=/dev/null
          ./deploy/ci-local.sh
      - uses: actions/upload-artifact@v6
        with:
          name: yurirtc-test-only-${{ github.sha }}
          path: build/ci/test-only
          if-no-files-found: error
          retention-days: 14
