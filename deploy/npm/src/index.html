function renderDisconnected(attempt, retryInMs) {
  networkConnected = false;
  clearInterval(retryTimer);
  bootLayer.classList.remove(names.plain);
  setNetworkIndicator("disconnected", lastTier, copy.interrupted);
  bootLayer.classList.remove(names.done);
  network.classList.remove(names.done);
  bootLayer.dataset.yurirtcView = "disconnected";
  bootLayer.setAttribute("role", "alert");
  bootLayer.setAttribute("aria-label", `${rot13(copy.disconnectedTitle)}. ${rot13(copy.disconnectedBody)}`);

  const retry = bootLayer.querySelector("[data-yurirtc-retry-status]");
  const started = performance.now();
  const updateRetry = () => {
    const remaining = Math.max(0, retryInMs - (performance.now() - started));
    const seconds = Math.ceil(remaining / 1000);
    retry.dataset.yurirtcRetrySeconds = String(seconds);
    retry.textContent = remaining > 0
      ? rot13(`Automatic retry ${attempt} in ${seconds}s`)
      : copy.tryingNow;
    if (remaining <= 0) clearInterval(retryTimer);
  };
  updateRetry();
  if (retryInMs > 0) retryTimer = setInterval(updateRetry, 250);
  bootLayer.querySelector("[data-yurirtc-reconnect]").addEventListener("click", () => reconnect("manual"));
}

function acceptNetworkState(detail) {
  if (!detail || typeof detail !== "object") return;
  if (detail.state === "testing") {
    networkConnected = false;
    clearInterval(retryTimer);
    setNetworkIndicator("testing", "", copy.networkTesting);
    if (bootLayer.dataset.yurirtcView === "disconnected" || bootLayer.dataset.yurirtcView === "unavailable") {
      renderPending();
    }
    return;
  }
  if (detail.state === "connected") {
    const transport = detail.route?.transport;
    const portClass = detail.route?.portClass;
    const route = routeTiers[`${transport}:${portClass}`];
    const validTransport = transport === "udp" || transport === "tcp" || transport === "unknown";
    const validPortClass = portClass === "standard" || portClass === "443" || portClass === "unknown";
    if (!route && (!validTransport || !validPortClass)) return;
    clearInterval(retryTimer);
    networkConnected = true;
    bootLayer.removeAttribute("role");
    bootLayer.removeAttribute("aria-label");
    lastTier = route?.[0] ?? "";
    setNetworkIndicator("connected", lastTier, route?.[1] ?? copy.connectedUnknown);
    if (app.querySelector("iframe")) {
      bootLayer.classList.add(names.done);
      // The censorship indicator's job is the connect phase; once the app is
      // on screen it fades out instead of overlaying it.
      network.classList.add(names.done);
    }
    return;
  }
  if (detail.state === "disconnected") {
    const attempt = Number.isSafeInteger(detail.attempt) && detail.attempt > 0
      ? Math.min(detail.attempt, 999)
      : 1;
    const retryInMs = Number.isFinite(detail.retryInMs)
      ? Math.max(0, Math.min(detail.retryInMs, 300000))
      : 0;
    renderDisconnected(attempt, retryInMs);
    return;
  }
  if (detail.state === "unavailable") renderUnavailable();
}

window.addEventListener(NETWORK_EVENT, (event) => acceptNetworkState(event.detail));

  void document.fonts.load(`400 1rem '${names.font}'`).then((faces) => {
    if (faces.length > 0) document.body.dataset.yurirtcFontReady = "true";
  }).catch(() => undefined);
}

async function bundledClientBytes(descriptor) {
  const payload = document.getElementById(descriptor?.clientElementId);
  const encoded = payload?.textContent ?? "";
  payload?.remove();
  if (
    !encoded || encoded.length % 4 !== 0 ||
    !/^[A-Za-z0-9+/]+={0,2}$/.test(encoded)
  ) {
    throw new LoaderResolutionError("integrity-failure", {
      descriptor,
      reason: "loader-encoding"
    });
  }
  let bytes;
  try {
    const binary = atob(encoded);
    bytes = new Uint8Array(binary.length);
    for (let index = 0; index < binary.length; index += 1) {
      bytes[index] = binary.charCodeAt(index);
    }
  } catch {
    throw new LoaderResolutionError("integrity-failure", {
      descriptor,
      reason: "loader-encoding"
    });
  }
  let digest;
  try {
    const hashed = new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
    digest = btoa(String.fromCharCode(...hashed))
      .replace(/\+/g, "-")
      .replace(/\//g, "_")
      .replace(/=+$/, "");
  } catch {
    throw new LoaderResolutionError("integrity-failure", {
      descriptor,
      bytes,
      reason: "crypto-unavailable"
    });
  }
  if (digest !== descriptor.sha256) {
    throw new LoaderResolutionError("integrity-failure", {
      descriptor,
      bytes,
      reason: "loader-hash"
    });
  }
  return bytes;
}

function closeCarrier() {
  window.close();
  setTimeout(() => {
    document.body.replaceChildren();
    document.documentElement.style.background = "#151216";
    try { location.replace("about:blank"); } catch {}

}

  bootLayer.dataset.yurirtcView = "loader-error";
  bootLayer.dataset.yurirtcLoaderError = kind;
  bootLayer.setAttribute("role", "alertdialog");
  bootLayer.setAttribute("aria-modal", "true");
}

function renderIntegrityWarning(error) {
  prepareLoaderError("integrity");
  bootLayer.dataset.yurirtcLoaderIntegrityStage = error?.bytes
    ? "loader-hash"
    : "manifest-signature";
  bootLayer.dataset.yurirtcLoaderIntegrityReason = error?.reason ?? "unknown";
  if (error?.manifestFingerprint) {
    bootLayer.dataset.yurirtcLoaderManifestFingerprint = error.manifestFingerprint;
  }
  const title = rot13(copy.integrityTitle);
  const body = rot13(copy.integrityBody);
  bootLayer.setAttribute("aria-label", `${title} ${body}`);
  bootLayer.innerHTML = `<div class="${names.card}"><div class="${names.screenIcon}" aria-hidden="true">gpp_maybe</div><h1 class="${names.screenTitle}">${title}</h1><p class="${names.screenBody}">${body}</p><a class="${names.loaderLink}" href="https://www.fortinet.com/resources/cyberglossary/man-in-the-middle-attack" target="_blank" rel="noopener noreferrer">${rot13(copy.integrityArticle)}</a><div class="${names.actions}"><button type="button" class="${names.action}" data-yurirtc-loader-continue disabled></button><button type="button" class="${names.action} ${names.secondaryAction}" data-yurirtc-loader-close>${rot13(copy.close)}</button></div></div>`;
  const continueButton = bootLayer.querySelector("[data-yurirtc-loader-continue]");
  const deadline = performance.now() + 3000;
  const updateCountdown = () => {
    const seconds = Math.max(0, Math.ceil((deadline - performance.now()) / 1000));
    continueButton.textContent = seconds > 0 ? `${rot13(copy.continue)} (${seconds}s)` : rot13(copy.continue);
    if (seconds === 0) {
      continueButton.disabled = false;
      clearInterval(retryTimer);
    }
  };
  updateCountdown();
  retryTimer = setInterval(updateCountdown, 100);
  continueButton.addEventListener("click", async () => {
    continueButton.disabled = true;
    try {
      const bytes = await continueUnverified(error);
      const client = await importClientBytes(bytes);
      if (error.descriptor) installLoaderFont(error.descriptor);
      await startClient(client, error.descriptor);
    } catch {
      renderLoaderUnavailable();
    }
  });
  bootLayer.querySelector("[data-yurirtc-loader-close]").addEventListener("click", closeCarrier);
}

function fail(error) {
  void error;
  console.warn(rot13("[LhevEGP] genafcbeg fgneghc snvyrq"));
  renderUnavailable();
}

async function startClient(client, descriptor) {
  const { boot } = client;
  if (typeof boot !== "function") throw new Error("loader client has no boot export");
  if (!descriptor?.version) throw new Error("loader client has no pinned worker version");
  renderPending();
  phase(copy.connecting);
  const recovery = bundledLoader
    ? {
        recovery: {
          clientUrls: [new URL(descriptor.clientPath, location.href).href]
        }
      }
    : {};
  await boot({
    ...config,
    ...recovery,
    swUrl: `sw.js?yurirtc-loader=${encodeURIComponent(descriptor.version)}`,
    mount: app,
    appPath: "/",
    onDiagnostics: (diagnostics) => {
      phase(copy.connected);
      hint("");
      const transport = diagnostics?.route?.transport ?? diagnostics?.protocol;
      const portClass = diagnostics?.route?.portClass ?? diagnostics?.portClass;
      acceptNetworkState({ state: "connected", route: { transport, portClass } });
    }
  });

  const frame = app.querySelector("iframe");
  const revealApp = () => {
    if (!networkConnected) return;
    bootLayer.classList.add(names.done);
    network.classList.add(names.done);
  };
  frame?.addEventListener("load", revealApp, { once: true });
  setTimeout(revealApp, 8000);
}

try {
  if (!window.isSecureContext) throw new Error("a secure HTTPS context is required");
  if (!("serviceWorker" in navigator)) throw new Error("service workers are unavailable");
  phase(copy.loading);
  const resolved = bundledLoader
    ? {
        descriptor: bundledLoader,
        bytes: await bundledClientBytes(bundledLoader)
      }
    : await resolveLoader({
        publicKeySpki: manifestPublicKey,
        pointerUrls: testAssetBase ? [`${testAssetBase}/loader.json`] : undefined,
        fetchImpl: testAssetBase
          ? (url, init) => fetch(
              String(url).endsWith("/dist/bundle/client.js")
                ? `${testAssetBase}/client.js`
                : url,
              init
            )
          : undefined
      });
  installLoaderFont(resolved.descriptor);
  await startClient(await importClientBytes(resolved.bytes), resolved.descriptor);
} catch (error) {
  if (error instanceof LoaderResolutionError && error.code === "integrity-failure") {
    renderIntegrityWarning(error);
  } else if (error instanceof LoaderResolutionError && error.code === "cdn-unavailable") {
    renderLoaderUnavailable();
  } else {
    fail(error);
  }
}
</script>
